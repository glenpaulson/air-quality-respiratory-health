<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Hazy city skyline representing air quality">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8db8"/>
      <stop offset="0.5" stop-color="#a9c2d6"/>
      <stop offset="1" stop-color="#e6d8c3"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ba8f" stop-opacity="0"/>
      <stop offset="1" stop-color="#c99f6b" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3e50"/>
      <stop offset="1" stop-color="#1a2735"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <circle cx="960" cy="120" r="46" fill="#f4e6c8" opacity="0.85"/>

  <!-- far skyline -->
  <g fill="#7f98ad" opacity="0.55">
    <rect x="40" y="230" width="60" height="120"/><rect x="120" y="200" width="45" height="150"/>
    <rect x="185" y="250" width="70" height="100"/><rect x="275" y="215" width="40" height="135"/>
    <rect x="900" y="220" width="55" height="130"/><rect x="975" y="245" width="45" height="105"/>
    <rect x="1035" y="205" width="60" height="145"/><rect x="1110" y="240" width="50" height="110"/>
  </g>

  <!-- haze band -->
  <rect x="0" y="250" width="1200" height="120" fill="url(#haze)"/>

  <!-- near skyline -->
  <g fill="url(#city)">
    <rect x="130" y="270" width="80" height="150"/><rect x="225" y="235" width="60" height="185"/>
    <rect x="300" y="290" width="90" height="130"/><rect x="405" y="250" width="55" height="170"/>
    <rect x="475" y="210" width="70" height="210"/><rect x="560" y="265" width="85" height="155"/>
    <rect x="660" y="240" width="60" height="180"/><rect x="735" y="285" width="95" height="135"/>
    <rect x="845" y="255" width="60" height="165"/><rect x="920" y="290" width="80" height="130"/>
    <rect x="1015" y="245" width="65" height="175"/>
  </g>
  <!-- window glints -->
  <g fill="#e8c000" opacity="0.5">
    <rect x="495" y="235" width="8" height="10"/><rect x="512" y="255" width="8" height="10"/>
    <rect x="245" y="260" width="8" height="10"/><rect x="678" y="270" width="8" height="10"/>
    <rect x="1035" y="275" width="8" height="10"/>
  </g>

  <text x="60" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#14212e">
    Air Quality &amp; Respiratory Health
  </text>
  <text x="62" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#2c3e50">
    Air pollution, weather, and public health across 50 U.S. cities
  </text>
</svg>
